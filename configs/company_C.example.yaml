schema_version: 1
company_id: C_DEMO
reporting_currency: USD
matching:
  repeat_sources: [invoices]
sources:
  - name: invoices
    path: examples/company_C/purchases.csv
    amount_basis: gross
    vat_default: '0.15'
    status_policy: require_approved
    rate_convention: units_per_reporting
    number_format: {decimal: '.', thousands: ''}
    date_formats:
      invoice_date: ['%Y-%m-%d']
    fields:
      source_record_id: row_id
      invoice_number: invoice_ref
      invoice_line: line_no
      invoice_date: date
      amount: gross_amount
      vat_rate: vat
      currency: currency
      currency_rate: units_per_usd
      status: state
      supplier_id: vendor
      supplier_name: vendor_name
      item_code: sku
      description: text
      quantity: quantity
      unit: unit
taxonomy:
  path: examples/company_C/tree.csv
  fields: {l1: division, l2: group, l3: family, l4: category}
